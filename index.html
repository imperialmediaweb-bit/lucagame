<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7B5CF6">
<title>Mintoria</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="Mintoria: joc de învățat matematică și română, pregătitoare – clasa a IV-a, singur sau cu colegii.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="loading"><img src="./logo.svg" alt="Mintoria" style="width:min(360px,80vw)"><div class="bar"><i></i></div><small style="font-family:var(--font-b);font-size:14px">Se încarcă lumea minții…</small></div>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill" title="Monede"><span class="ic"></span><span id="coins">0</span></div>
  <div class="pill" title="Stele"><span class="st">★</span><span id="stars">0</span></div>
  <div class="pill" id="streakPill" title="Zile la rând"><span id="streak">Serie 0</span></div>
  <div class="pill daybar" title="Timp de antrenament azi"><span>Azi</span><span class="tr"><i id="dayFill"></i></span><span id="dayMin">0/20</span></div>
  <div class="grow"></div>
  <div class="menu">
    <button class="btn" id="roomBtn" type="button" hidden>Camera</button>
    <button class="btn" id="openDaily" type="button">Antrenament</button>
    <button class="iconbtn" id="openMulti" type="button">Cu colegii</button>
    <button class="iconbtn" id="openJournal" type="button">Misiuni</button>
    <button class="iconbtn" id="openAtelier" type="button">Atelier</button>
    <button class="iconbtn" id="openShop" type="button">Garderoba</button>
    <button class="iconbtn" id="openProg" type="button">Progres</button>
    <button class="iconbtn" id="mute" type="button">Sunet: da</button>
    <button class="iconbtn" id="openMenu" type="button" aria-label="Meniu">☰ Meniu</button>
  </div>
</div>

<div id="quest" hidden>
  <div class="qa" id="qArrow">↑</div>
  <div class="qt"><b id="qTitle">…</b><span id="qSub">…</span></div>
  <button class="btn" id="qGo" type="button">Du-mă</button>
</div>

<div id="stick" hidden><div id="knob"></div></div>
<button class="btn" id="jump" type="button" hidden>Sari</button>
<button class="btn" id="act" type="button" hidden>Vorbește</button>
<div id="keys" hidden>Mergi: W A S D · Sari: Spațiu · Vorbește: E · Camera: trage cu mouse-ul</div>
<div id="toast"></div>

<div class="overlay" id="quiz" hidden><div class="card" id="quizCard"></div></div>
<div class="overlay" id="panel" hidden><div class="card" id="panelCard"></div></div>
<div id="draft" hidden>
  <div class="tools">
    <span class="ttl">Ciornă</span>
    <button class="tool" type="button" id="mType">Scriu cu tastatura</button>
    <button class="tool" type="button" id="mDraw">Desenez</button>
    <button class="tool on drawonly" type="button" data-pen="#2456b8" aria-label="Pix albastru"><span class="sw2" style="background:#2456b8"></span></button>
    <button class="tool drawonly" type="button" data-pen="#d23a3a" aria-label="Pix roșu"><span class="sw2" style="background:#d23a3a"></span></button>
    <button class="tool drawonly" type="button" data-pen="erase">Radieră</button>
    <button class="tool" type="button" id="draftClear">Șterge tot</button>
    <button class="tool" type="button" id="draftClose">Închide</button>
  </div>
  <div class="keys"><button type="button" data-ins="+">+</button><button type="button" data-ins="−">−</button><button type="button" data-ins="×">×</button><button type="button" data-ins=":">:</button><button type="button" data-ins="=">=</button><button type="button" data-ins="(">(</button><button type="button" data-ins=")">)</button><button type="button" data-ins="[">[</button><button type="button" data-ins="]">]</button><button type="button" data-ins="↵">↵</button></div>
  <div id="paper"><canvas id="paperC"></canvas><textarea id="paperT" spellcheck="false" autocomplete="off" aria-label="Ciornă scrisă" placeholder="Scrie aici calculele, de ex. 32 : 8 = 4"></textarea></div>
</div>
<div id="confetti"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
