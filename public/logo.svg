<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" role="img" aria-label="Mintoria">
  <style>.w{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:800;font-size:92px;letter-spacing:3px}</style>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FE3C4"/><stop offset="1" stop-color="#2EC4A6"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B5CF6"/><stop offset="1" stop-color="#5A3BD6"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FF7A2F"/></linearGradient>
  </defs>
  <g transform="translate(6 6) scale(1)">
