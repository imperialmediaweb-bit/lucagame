    <circle cx="33" cy="72" r="5" fill="#1F2B3A"/><circle cx="47" cy="79" r="5" fill="#1F2B3A"/>
    <path d="M30 86 Q40 98 50 92" fill="none" stroke="#1F2B3A" stroke-width="4" stroke-linecap="round"/>
